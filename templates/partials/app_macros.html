{#- The App tab's charts: a card with a title, a period and the design
    system's line chart (`c` is vole_kit::components::LineChart). -#}
{% import "kit/macros.html" as m %}
{% macro chart(c, id, title, sub) -%}
<section class="card" aria-labelledby="{{ id }}">
  <div class="card-head">
    <div>
      <h2 class="card-title" id="{{ id }}">{{ title }}</h2>
      <p class="card-sub">{{ sub }}</p>
    </div>
  </div>
  {{ m::line_chart(c) }}
</section>
{%- endmacro %}
