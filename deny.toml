# cargo-deny configuration, used by the Audit workflow (advisories). [licenses].allow mirrors the
# allowlist in about.toml (a unit test keeps them equal); about.toml is what CI enforces.
[advisories]
ignore = [
    # basic-toml is unmaintained. askama's derive macro uses it at build time to
    # read askama.toml; it never sees untrusted input. Drop when askama moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via askama_derive; no untrusted input" },
    # zstd 0.13 / zstd-safe 7 remain only through symbolic-debuginfo 14.0.0-alpha.5 (the
    # newest), which calls zstd::bulk::decompress for compressed ELF
    # sections and nothing else. 0391 needs a reused stream context
    # (with_context), 0398 the seekable feature and 0403 a streaming decoder;
    # symbolic uses none of them. Kestrel's own code uses zstd 0.14.3. Drop these
    # when a symbolic release moves to zstd 0.14 (its main branch has since 2026-11-04).
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 only via symbolic-debuginfo, which uses bulk::decompress, no shared context" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 only via symbolic-debuginfo; seekable feature not enabled" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 only via symbolic-debuginfo, which never streams; bulk decompress only" },
]

[licenses]
# Licenses of the crates we depend on. Strong copyleft is not on this list. The project's own
# crates (AGPL-3.0-only, publish = false) are private and skipped.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true
