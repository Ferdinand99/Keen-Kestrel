# cargo-deny configuration, used by the Audit workflow (advisories only).
[advisories]
ignore = [
    # basic-toml is unmaintained. askama's derive macro uses it at build time to
    # read askama.toml; it never sees untrusted input. Drop when askama moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via askama_derive; no untrusted input" },
    # zip < 9: ZipArchive::extract / ZipStreamReader::extract mishandle symlinks
    # and SUID bits. Kestrel never calls extract(): src/difs/files.rs reads each
    # entry itself, within limits, into files it names entry-<n>, with no
    # symlinks or permissions. Move to zip 9 in the October security review.
    { id = "RUSTSEC-2026-0367", reason = "extract() is not used; see src/difs/files.rs" },
    { id = "RUSTSEC-2026-0368", reason = "extract() is not used; see src/difs/files.rs" },
    { id = "RUSTSEC-2026-0369", reason = "extract() is not used; see src/difs/files.rs" },
]
